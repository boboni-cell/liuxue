<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩国留学可能性评估</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #2B4C7E;
    --primary-light: #3B6FB6;
    --primary-bg: #EEF2F8;
    --accent: #C8775D;
    --accent-light: #FDF0EC;
    --success: #3B8C7A;
    --success-bg: #EDF7F4;
    --bg: #F8F8FA;
    --card: #FFFFFF;
    --text: #1C1C2E;
    --text-secondary: #6B7280;
    --text-light: #9CA3AF;
    --border: #E5E7EB;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --shadow-lg: 0 12px 48px rgba(0,0,0,0.08);
    --radius: 12px;
    --radius-lg: 16px;
    --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  #root {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--bg);
    position: relative;
    overflow: hidden;
  }

  /* ── Hero ── */
  .hero {
    padding: 60px 28px 48px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    animation: fadeIn 0.6s ease;
  }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--primary-bg);
    color: var(--primary);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 28px;
    letter-spacing: 0.02em;
  }

  .hero-badge::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  .hero h1 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--text);
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  .hero h1 span {
    color: var(--primary);
  }

  .hero p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 36px;
    max-width: 320px;
  }

  .hero-features {
    display: flex;
    gap: 24px;
    margin-bottom: 40px;
    font-size: 13px;
    color: var(--text-light);
  }

  .hero-feature {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .hero-feature svg {
    width: 16px; height: 16px;
    color: var(--success);
    flex-shrink: 0;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
    font-size: 16px;
    transition: all var(--transition);
    border-radius: var(--radius);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    padding: 16px 40px;
    font-size: 17px;
    letter-spacing: 0.01em;
    box-shadow: 0 4px 16px rgba(43,76,126,0.25);
  }

  .btn-primary:hover {
    background: var(--primary-light);
    box-shadow: 0 6px 24px rgba(43,76,126,0.35);
    transform: translateY(-1px);
  }

  .btn-primary:active {
    transform: translateY(0) scale(0.97);
  }

  .btn-secondary {
    background: var(--card);
    color: var(--text-secondary);
    padding: 12px 24px;
    font-size: 14px;
    border: 1px solid var(--border);
  }

  .btn-secondary:hover {
    border-color: #CBD5E1;
    color: var(--text);
  }

  .btn-submit {
    width: 100%;
    background: var(--primary);
    color: #fff;
    padding: 16px;
    font-size: 16px;
    letter-spacing: 0.02em;
    border-radius: var(--radius);
    box-shadow: 0 4px 16px rgba(43,76,126,0.2);
  }

  .btn-submit:hover {
    background: var(--primary-light);
    box-shadow: 0 6px 24px rgba(43,76,126,0.3);
  }

  .btn-submit:disabled {
    background: #CBD5E1;
    color: #9CA3AF;
    box-shadow: none;
    cursor: not-allowed;
  }

  /* ── Assessment Area ── */
  .assessment {
    padding: 0 24px 120px;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideInRight {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: translateX(0); }
  }

  @keyframes slideInLeft {
    from { opacity: 0; transform: translateX(-24px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .slide-in-right { animation: slideInRight 0.35s ease; }
  .slide-in-left { animation: slideInLeft 0.35s ease; }

  /* ── Header Bar ── */
  .assess-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }

  .assess-back {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: var(--card);
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
  }

  .assess-back:hover { background: #F1F5F9; color: var(--text); }
  .assess-back:active { transform: scale(0.93); }

  .assess-step {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 500;
  }

  .assess-close {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: transparent;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-light);
    font-size: 18px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Progress ── */
  .progress-wrap {
    margin-bottom: 32px;
  }

  .progress-bar {
    height: 4px;
    background: #E5E7EB;
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 2px;
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-light);
  }

  /* ── Question Card ── */
  .question-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }

  .question-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 12px;
  }

  .question-title {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    line-height: 1.4;
  }

  .question-hint {
    font-size: 13px;
    color: var(--text-light);
    margin-bottom: 24px;
  }

  /* ── Options ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--bg);
    border: 1.5px solid transparent;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    position: relative;
  }

  .option:hover {
    background: #F1F5F9;
  }

  .option.selected {
    background: var(--primary-bg);
    border-color: var(--primary);
    color: var(--primary);
  }

  .option.multi-selected {
    background: var(--primary-bg);
    border-color: var(--primary);
  }

  .option-radio {
    width: 20px; height: 20px;
    border-radius: 50%;
    border: 2px solid #CBD5E1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .option.selected .option-radio {
    border-color: var(--primary);
    background: var(--primary);
  }

  .option.selected .option-radio::after {
    content: '';
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
  }

  .option-checkbox {
    width: 20px; height: 20px;
    border-radius: 4px;
    border: 2px solid #CBD5E1;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
  }

  .option.multi-selected .option-checkbox {
    border-color: var(--primary);
    background: var(--primary);
  }

  .option.multi-selected .option-checkbox::after {
    content: '';
    width: 10px; height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translate(0.5px, -1px);
  }

  /* ── Navigation ── */
  .nav-buttons {
    display: flex;
    gap: 12px;
    margin-top: 24px;
  }

  .nav-buttons .btn {
    flex: 1;
  }

  /* ── Contact Form ── */
  .form-group {
    margin-bottom: 18px;
  }

  .form-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 8px;
  }

  .form-label .required {
    color: var(--accent);
    margin-left: 2px;
  }

  .form-label .optional {
    font-size: 12px;
    color: var(--text-light);
    font-weight: 400;
    margin-left: 6px;
  }

  .form-input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 15px;
    color: var(--text);
    background: var(--bg);
    transition: all var(--transition);
    -webkit-appearance: none;
    outline: none;
  }

  .form-input:focus {
    border-color: var(--primary);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(43,76,126,0.08);
  }

  .form-input::placeholder {
    color: #CBD5E1;
  }

  .form-input.error {
    border-color: #EF4444;
  }

  .form-error {
    font-size: 12px;
    color: #EF4444;
    margin-top: 6px;
  }

  /* ── Privacy Note ── */
  .privacy-note {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 12px;
    color: var(--text-light);
    line-height: 1.5;
    margin-top: 12px;
    padding: 12px;
    background: var(--bg);
    border-radius: var(--radius);
  }

  .privacy-note svg {
    width: 16px; height: 16px;
    flex-shrink: 0;
    margin-top: 1px;
    color: var(--text-light);
  }

  /* ── Success Page ── */
  .success {
    padding: 48px 28px;
    text-align: center;
    animation: fadeIn 0.6s ease;
  }

  .success-icon {
    width: 72px; height: 72px;
    background: var(--success-bg);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }

  .success h2 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
  }

  .success > p {
    font-size: 15px;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .success-timeline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 24px 0 36px;
    font-size: 13px;
    color: var(--text-secondary);
  }

  .success-timeline-step {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .success-timeline-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--success);
  }

  .success-timeline-line {
    width: 28px; height: 1px;
    background: #CBD5E1;
  }

  /* ── Case Cards ── */
  .cases-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
    text-align: left;
    margin-bottom: 16px;
  }

  .case-cards {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 36px;
  }

  .case-card {
    background: var(--card);
    border-radius: var(--radius-lg);
    padding: 20px;
    text-align: left;
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--border);
  }

  .case-card-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .case-avatar {
    width: 40px; height: 40px;
    border-radius: 50%;
    background: var(--primary-bg);
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .case-name {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
  }

  .case-detail {
    font-size: 12px;
    color: var(--text-light);
  }

  .case-arrow {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    font-weight: 500;
  }

  .case-from {
    color: var(--text-secondary);
  }

  .case-arrow svg {
    color: var(--success);
    flex-shrink: 0;
  }

  .case-to {
    color: var(--primary);
    font-weight: 600;
  }

  .case-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    background: var(--success-bg);
    color: var(--success);
    margin-top: 10px;
    font-weight: 500;
  }

  /* ── Bottom CTA ── */
  .bottom-cta {
    padding: 12px 28px 36px;
    position: sticky;
    bottom: 0;
    background: linear-gradient(to top, var(--bg) 80%, transparent);
  }

  /* ── Responsive ── */
  @media (min-width: 481px) {
    .app {
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }
    .hero h1 { font-size: 32px; }
    .question-title { font-size: 22px; }
  }

  @media (max-width: 360px) {
    .hero { padding: 40px 20px 36px; }
    .hero h1 { font-size: 24px; }
    .assessment { padding: 0 16px 100px; }
    .question-card { padding: 24px 18px; }
    .question-title { font-size: 18px; }
    .option { padding: 14px 16px; font-size: 14px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useCallback, useRef, useEffect } = React;

/* ── Icons (inline SVGs) ── */
const Icons = {
  Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,

  Sparkle: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5z"/></svg>,

/* ── Questions Data ── */
const TOTAL_STEPS = 9; // 7 questions + 1 contact + 1 submit

const QUESTIONS = [
  {
    id: 'education',
    label: '问题 1 / 7',

      { value: '研究生', label: '研究生', desc: '硕士/硕博连读' },
      { value: '博士', label: '博士', desc: '博士学位课程' },
    ],
  },
  {
    id: 'koreanLevel',
    label: '问题 3 / 7',
    title: '你的韩语水平？',
    hint: '选择最接近你当前韩语能力的选项',
    type: 'single',
    options: [
      { value: '零基础', label: '零基础', desc: '完全没学过或刚入门' },
      { value: 'TOPIK 1-2级', label: 'TOPIK 1-2级', desc: '初级水平，日常简单交流' },
      { value: 'TOPIK 3-4级', label: 'TOPIK 3-4级', desc: '中级水平，可进行日常对话' },

  {

    type: 'single',
    options: [

/* ── Single Choice Question ── */
function SingleChoice({ question, value, onChange }) {
  return (
    <div className="options">
      {question.options.map((opt) => (
        <div
          key={opt.value}
          className={`option ${value === opt.value ? 'selected' : ''}`}
          onClick={() => onChange(opt.value)}
        >
          <div className="option-radio" />
          <div>
            <div>{opt.label}</div>
            {opt.desc && <div style={{fontSize:'12px',color:'var(--text-light)',marginTop:'2px'}}>{opt.desc}</div>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Multi Choice Question ── */
function MultiChoice({ question, value, onChange }) {
  const selected = value || [];
  const toggle = (optValue) => {
    if (selected.includes(optValue)) {
      onChange(selected.filter(v => v !== optValue));
    } else {
      onChange([...selected, optValue]);
    }
  };
  return (
    <div className="options">
      {question.options.map((opt) => (
        <div
          key={opt.value}
          className={`option ${selected.includes(opt.value) ? 'multi-selected' : ''}`}
          onClick={() => toggle(opt.value)}
        >
          <div className="option-checkbox" />
          <div>
            <div>{opt.label}</div>
            {opt.desc && <div style={{fontSize:'12px',color:'var(--text-light)',marginTop:'2px'}}>{opt.desc}</div>}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ── Main App ── */
function App() {
  const [phase, setPhase] = useState('hero'); // 'hero' | 'assessment' | 'success'
  const [step, setStep] = useState(0); // 0-6: questions, 7: contact
  const [animDir, setAnimDir] = useState('right'); // animation direction
  const [answers, setAnswers] = useState({});
  const [contact, setContact] = useState({ name: '', wechat: '', phone: '' });
  const [errors, setErrors] = useState({});
  const assessmentRef = useRef(null);

  const startAssessment = useCallback(() => {
    setPhase('assessment');
    setStep(0);
    setAnimDir('right');
  }, []);

  const handleAnswer = useCallback((questionId, value) => {
    setAnswers(prev => ({ ...prev, [questionId]: value }));
  }, []);

  const handleContactChange = useCallback((field, value) => {
    setContact(prev => ({ ...prev, [field]: value }));
    setErrors(prev => ({ ...prev, [field]: '' }));
  }, []);

  const nextStep = useCallback(() => {
    if (step < TOTAL_STEPS - 1) {
      setAnimDir('right');
      setStep(prev => prev + 1);
      assessmentRef.current?.scrollIntoView?.({ behavior: 'smooth', block: 'start' });
    }
  }, [step]);

  const prevStep = useCallback(() => {
    if (step > 0) {
      setAnimDir('left');
      setStep(prev => prev - 1);
      assessmentRef.current?.scrollIntoView?.({ behavior: 'smooth', block: 'start' });
    }
  }, [step]);

  const canProceed = useCallback(() => {
    if (step < QUESTIONS.length) {
      const q = QUESTIONS[step];
      if (q.type === 'single') {
        return !!answers[q.id];
      }
      if (q.type === 'multi') {
        return answers[q.id] && answers[q.id].length > 0;
      }
    }
    if (step === QUESTIONS.length) {
      // Contact step
      return contact.name.trim() !== '' && contact.wechat.trim() !== '';
    }
    return true;
  }, [step, answers, contact]);

  const handleSubmit = useCallback(() => {
    const newErrors = {};
    if (!contact.name.trim()) {
      newErrors.name = '请输入姓名';
    }
    if (!contact.wechat.trim()) {
      newErrors.wechat = '请输入微信号';
    }
    if (Object.keys(newErrors).length > 0) {
      setErrors(newErrors);
      return;
    }

    const now = new Date();
    const submitTime = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

    const client = {
      id: Date.now(),
      name: contact.name.trim(),
      wechat: contact.wechat.trim(),
      phone: contact.phone.trim(),
      education: answers.education || '',
      targetDegree: answers.targetDegree || '',
      koreanLevel: answers.koreanLevel || '',
      englishLevel: answers.englishLevel || '',
      targetSchools: answers.targetSchools || [],
      enrollmentTime: answers.enrollmentTime || '',
      concerns: answers.concerns || [],
      submitTime: submitTime,
      status: 'new',
      notes: [],
    };

    const existing = JSON.parse(localStorage.getItem('clients') || '[]');
    existing.push(client);
    localStorage.setItem('clients', JSON.stringify(existing));

    console.log('=== 留学评估问卷提交数据 ===');
    console.log(JSON.stringify(client, null, 2));
    console.log('当前总客户数:', existing.length);
    console.log('==============================');

    setPhase('success');
  }, [answers, contact]);

  const resetAll = useCallback(() => {
    setPhase('hero');
    setStep(0);
    setAnswers({});
    setContact({ name: '', wechat: '', phone: '' });
    setErrors({});
  }, []);

  // Scroll to top on phase change
  useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [phase]);

  useEffect(() => {
    if (phase === 'assessment' && assessmentRef.current) {
      assessmentRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }, [phase]);

  const isContactStep = step === QUESTIONS.length;
  const currentQuestion = step < QUESTIONS.length ? QUESTIONS[step] : null;
  const progressPercent = Math.round((step / (TOTAL_STEPS - 1)) * 100);

  return (
    <div className="app">
      {phase === 'hero' && <Hero onStart={startAssessment} />}

      {phase === 'assessment' && (
        <div className="assessment" ref={assessmentRef} key={`step-${step}`}>
          {/* Header */}
          <div className="assess-header">
            <button className="assess-back" onClick={step === 0 ? resetAll : prevStep}>
              <Icons.ArrowLeft />
            </button>
            <span className="assess-step">
              {isContactStep ? '最后一步' : `${step + 1} / ${QUESTIONS.length}`}
            </span>
            <button className="assess-close" onClick={resetAll}>✕</button>
          </div>

          {/* Progress */}
          <div className="progress-wrap">
            <div className="progress-bar">
              <div className="progress-fill" style={{ width: `${progressPercent}%` }} />
            </div>
          </div>

          {/* Content */}
          <div className={animDir === 'right' ? 'slide-in-right' : 'slide-in-left'}>
            {isContactStep ? (
              /* ── Contact Step ── */
              <div className="question-card">
                <div className="question-label">最后一步</div>
                <div className="question-title">留下联系方式，获取评估结果</div>
                <div className="question-hint">顾问将根据你的问卷结果，为你提供个性化择校建议</div>
                <ContactForm data={contact} onChange={handleContactChange} errors={errors} />
              </div>
            ) : (
              /* ── Question Step ── */
              <div className="question-card">
                <div className="question-label">{currentQuestion.label}</div>
                <div className="question-title">{currentQuestion.title}</div>
                {currentQuestion.hint && (
                  <div className="question-hint">{currentQuestion.hint}</div>
                )}
                {currentQuestion.type === 'single' ? (
                  <SingleChoice
                    question={currentQuestion}
                    value={answers[currentQuestion.id]}
                    onChange={(v) => handleAnswer(currentQuestion.id, v)}
                  />
                ) : (
                  <MultiChoice
                    question={currentQuestion}
                    value={answers[currentQuestion.id]}
                    onChange={(v) => handleAnswer(currentQuestion.id, v)}
                  />
                )}
              </div>
            )}

            {/* Navigation */}
            <div className="nav-buttons">
              {!isContactStep ? (
                <button
                  className="btn btn-submit"
                  onClick={nextStep}
                  disabled={!canProceed()}
                >
                  下一题 <Icons.ArrowRight />
                </button>
              ) : (
                <button
                  className="btn btn-submit"
                  onClick={handleSubmit}
                  disabled={!canProceed()}
                >
                  提交评估 <Icons.Send />
                </button>
              )}
            </div>
          </div>
        </div>
      )}

      {phase === 'success' && <SuccessPage onReset={resetAll} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
